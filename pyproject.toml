[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-vad-plugin-noise"
dynamic = ["version"]
description = "noise ratio VAD plugin for OpenVoiceOS"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "JarbasAi", email = "jarbasai@mailfence.com" }]
requires-python = ">=3.9"
keywords = ["vad", "noise", "ovos", "openvoiceos", "plugin", "voice-activity-detection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "ovos-plugin-manager>=0.0.11,<3.0.0",
]

[project.optional-dependencies]
test = ["pytest", "ovoscope"]

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-vad-plugin-noise"
Repository = "https://github.com/OpenVoiceOS/ovos-vad-plugin-noise"

[project.entry-points."ovos.plugin.VAD"]
"ovos-vad-plugin-noise" = "ovos_vad_plugin_noise:NoiseVAD"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["ovos_vad_plugin_noise*"]

[tool.setuptools.dynamic]
version = { attr = "ovos_vad_plugin_noise.version.__version__" }
